name: CSMID Automated Cloud Pipeline

on:
  schedule:
    # Runs scraper twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      run_discovery:
        description: 'Run skin discovery to refresh tracked_items in Supabase?'
        type: boolean
        default: false
      run_backtest:
        description: 'Run walk-forward backtest after forecast?'
        type: boolean
        default: false
      run_neural_training:
        description: 'Train the neural forecaster model on all historical data?'
        type: boolean
        default: false
      neural_epochs:
        description: 'Number of training epochs (override, default: 50 )'
        type: string
        default: ''
      forecast_min_data_points:
        description: 'Minimum data points required for forecasting (override )'
        type: string
        default: ''
      forecast_horizon_hours:
        description: 'Forecast horizon in hours (override)'
        type: string
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
      SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ------------------------------------------------------------------
      # Install PyTorch — Only needed when neural training is triggered
      # ------------------------------------------------------------------
      - name: Install PyTorch (CPU ) for Neural Training
        if: github.event.inputs.run_neural_training == 'true'
        run: |
          echo "Installing PyTorch (CPU-only) for neural forecaster..."
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # ------------------------------------------------------------------
      # Optional / Scheduled Discovery Step
      # Runs on Sundays (UTC  ) OR when manually toggled in workflow_dispatch
      # ------------------------------------------------------------------
      - name: Run Skin Discovery (Weekly / Manual)
        if: github.event.inputs.run_discovery == 'true' || github.event.schedule == '0 0 * * 0'
        run: python -m src.main --mode discovery

      # ------------------------------------------------------------------
      # Standard Scraping & Analytics Pipeline (Runs every time)
      # ------------------------------------------------------------------
      - name: Run CSMID Pipeline (Scrape & Analytics)
        run: python -m src.main --mode all

      # ------------------------------------------------------------------
      # Prediction Phase — Runs after every scrape + analytics cycle
      # ------------------------------------------------------------------
      - name: Run Forecast Pipeline
        run: |
          echo "Running prediction pipeline..."
          ARGS="--mode predict"
          if [ -n "${{ inputs.forecast_min_data_points }}" ]; then
            ARGS="$ARGS --min-data-points ${{ inputs.forecast_min_data_points }}"
            echo "  Custom min-data-points: ${{ inputs.forecast_min_data_points }}"
          fi
          if [ -n "${{ inputs.forecast_horizon_hours }}" ]; then
            ARGS="$ARGS --horizon-hours ${{ inputs.forecast_horizon_hours }}"
            echo "  Custom horizon: ${{ inputs.forecast_horizon_hours }}h"
          fi
          python -m src.main $ARGS

      # ------------------------------------------------------------------
      # Optional Neural Training — Runs when manually toggled
      # ------------------------------------------------------------------
      - name: Train Neural Forecaster Model (Manual)
        if: github.event.inputs.run_neural_training == 'true'
        run: |
          echo "Training neural forecaster..."
          ARGS="--mode train"
          if [ -n "${{ inputs.neural_epochs }}" ]; then
            ARGS="$ARGS --train-epochs ${{ inputs.neural_epochs }}"
            echo "  Custom epochs: ${{ inputs.neural_epochs }}"
          fi
          python -m src.main $ARGS

      # ------------------------------------------------------------------
      # Optional Backtest — Runs when manually toggled in workflow_dispatch
      # ------------------------------------------------------------------
      - name: Run Walk-Forward Backtest (Manual)
        if: github.event.inputs.run_backtest == 'true'
        run: |
          echo "Running walk-forward backtest..."
          python -m src.main --mode backtest
