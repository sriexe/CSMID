name: Pull Request Tests

on:
  pull_request:
    branches:
      - main
      - fix/disable-unsafe-neural-inference
      - fix/neural-fallback-history-gate
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Include prerequisite backtest fixes for stacked PR validation
        run: |
          git fetch origin fix/backtest-report-metrics
          git merge --no-edit origin/fix/backtest-report-metrics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run test suite
        run: python -m pytest -q
